<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>CREAR</title>
  </head>
  <body>
    <div id="root">
      <div class="app-boot" role="status" aria-live="polite">
        <div class="app-boot__mark">C</div>
        <div>
          <strong>CREAR</strong>
          <span>Preparando tu espacio...</span>
        </div>
      </div>
    </div>
    <style>
      .app-boot {
        box-sizing: border-box;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        color: #0f172a;
        background: #f8fafc;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .app-boot__mark {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        color: #fff;
        background: #0f172a;
        font-weight: 900;
      }
      .app-boot strong,
      .app-boot span { display: block; }
      .app-boot strong { font-size: 13px; letter-spacing: .14em; }
      .app-boot span { margin-top: 2px; color: #64748b; font-size: 13px; }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
